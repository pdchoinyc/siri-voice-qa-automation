name: Siri Voice QA - Automated Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest
        run: |
          python -m pytest --junitxml=reports/pytest_results.xml --html=report.html --self-contained-html
      
      - name: Generate unified QA report
        if: always()
        run: python generate_qa_report.py

      - name: Generate HTML dashboard
        if: always()
        run: python generate_dashboard.py

      - name: Upload QA report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-report
          path: |
            reports/pytest_results.xml
            reports/qa_summary.json
            reports/qa_dashboard.html
          if-no-files-found: warn
          retention-days: 14

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-html-report
          path: report.html
          if-no-files-found: ignore